<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<title>Træningsapp</title>
<link rel="icon" href="data:,">
<!-- System fonts only: no requests to Google Fonts (keeps the app GDPR-clean, EU first). -->
<style>
:root{--bg:#0A0B0D;--fg:#F2F3F5;--muted:#8E929B;--faint:#7C808A;--line:#1C1E22;--field:#15171B;--seg:#2A2D33;--accent:#1F3C88;--accent-hi:#2A4CA3;--accent-text:#9DB8F2;--focus:#3A5BB0;--danger:#F08A80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:100dvh;position:relative}
.screen{display:flex;flex-direction:column;gap:32px;padding:calc(env(safe-area-inset-top) + 48px) 20px calc(env(safe-area-inset-bottom) + 40px)}
.screen.tabbed{padding-bottom:calc(env(safe-area-inset-bottom) + 108px)}
.title{margin:4px 0 0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.label{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.tnum{font-variant-numeric:tabular-nums}
.pos{color:var(--accent-text)}.danger{color:var(--danger)}
section{display:flex;flex-direction:column;gap:8px}
.list{gap:0}.list>.label,.list>.headrow{padding-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:4px 0;border-top:1px solid var(--line);font-size:15px;width:100%}
button.row{text-align:left}
button.row:hover .row-main{color:#fff}
.row .sub{font-size:13px;color:var(--muted)}
.row .right{font-size:13px;color:var(--muted);text-align:right;flex:none}
.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.btn{height:48px;width:100%;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;text-align:center}
.btn:hover{background:var(--accent-hi)}
.btn:disabled{background:var(--field);color:var(--muted)}
.btn.red{background:#7A2A23}
.btn-quiet{height:44px;width:100%;color:var(--muted);font-size:15px;text-align:center}
.btn-quiet.danger{color:var(--danger)}
.link{color:var(--accent-text);font-size:14px;font-weight:500;min-height:40px}
.link-muted{color:var(--muted);font-size:13px;min-height:32px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent-text);font-size:15px;min-height:44px;align-self:flex-start;margin-bottom:-24px}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent-text)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--field);border-radius:10px;padding:2px;gap:2px}
.seg button{height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--seg);color:var(--fg)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--seg);padding:2px;display:flex;align-items:center;flex:none;transition:background .15s}
.switch::after{content:"";width:27px;height:27px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(84px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);display:flex;justify-content:space-around;padding-top:10px;z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px;font-size:11px;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--fg)}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted)}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--seg)}
.dot.on{background:var(--accent-text)}
.dot.ring{background:none;box-shadow:inset 0 0 0 1px var(--accent-text)}
.week .today{color:var(--fg);font-weight:600}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat-v{font-size:20px;font-weight:600;margin-top:4px}
.text{height:44px;width:100%;border:0;border-radius:10px;background:var(--field);padding:0 12px;font-size:16px;outline:none}
.text:focus,.num:focus{box-shadow:inset 0 0 0 1px var(--focus)}
select{background:var(--field);border:0;border-radius:8px;height:36px;padding:0 8px;font-size:14px;max-width:62%}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:32px;height:32px;border-radius:8px;background:var(--field);text-align:center}
.stepper span{min-width:52px;text-align:center;font-size:13px;color:var(--muted)}
.x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
/* home */
.home{padding:0 20px}
.home-top{position:relative;height:calc(100svh - 84px - env(safe-area-inset-bottom));min-height:540px}
.home-head{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top) + 40px);z-index:1}
.home-bar{display:flex;align-items:center;gap:10px}
.splitwrap{position:relative;min-width:0}
.splitbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:20px;background:var(--field);font-size:15px;font-weight:600;max-width:240px}
.splitname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;top:46px;left:0;z-index:10;min-width:240px;background:#17191E;border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:6px 10px;border-radius:10px;text-align:left;font-size:15px}
.mitem:hover{background:var(--field)}
.mitem .sub{font-size:12px;color:var(--muted)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center}
.greet{margin:20px 0 0;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.hero{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto 1fr;text-align:center;pointer-events:none}
.hero-up{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-bottom:18px}
.hero-down{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.weekbox{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.streakrow{display:flex;align-items:center;gap:10px}
.hero>*{pointer-events:auto}
.hero-day{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.hero .btn{height:56px;font-size:17px;border-radius:14px}
.below{display:flex;flex-direction:column;gap:32px;padding-bottom:calc(env(safe-area-inset-bottom) + 108px)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.rcard{flex:0 0 190px;min-height:84px;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left}
.rcard.on{border-color:var(--focus)}
.rcard .n{font-size:15px;font-weight:600}
/* workout */
.wk-top{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
.wk-head{display:grid;grid-template-columns:88px 1fr 88px;align-items:center;padding:calc(env(safe-area-inset-top) + 44px) 20px 12px}
.wk-head .x{width:44px;height:44px;justify-content:flex-start}
.wk-title{text-align:center}.wk-title .t{font-size:16px;font-weight:600}
.btn-sm{justify-self:end;height:36px;padding:0 14px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;text-align:center}
.restbar{padding:10px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.restbar[hidden]{display:none}
.restrow{display:flex;justify-content:space-between;align-items:center}
.restrow .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:8px}
.chip{height:36px;padding:0 10px;border-radius:8px;background:var(--field);font-size:14px;text-align:center;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);color:#fff}
.track{height:2px;background:var(--line)}.fill{height:2px;background:var(--focus);width:0}
.wk-body{padding:16px 16px calc(env(safe-area-inset-bottom) + 40px);display:flex;flex-direction:column;gap:12px}
.ex{gap:4px}
.card{background:#111317;border:1px solid var(--line);border-radius:16px;padding:14px 12px 6px;scroll-margin-top:130px;transition:opacity .25s}
.card.done{opacity:.45}
.card.done:focus-within{opacity:1}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:4px}
.ex-name{font-size:16px;font-weight:600}
.set-grid{display:grid;grid-template-columns:32px 1fr 1fr 44px;gap:8px;align-items:center}
.set-head{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.num{height:40px;width:100%;border:0;border-radius:8px;background:var(--field);font-size:16px;padding:0 10px;outline:none}
.num::placeholder{color:var(--faint)}
.num.err{box-shadow:inset 0 0 0 1px var(--danger)}
.check{width:44px;height:40px;border-radius:8px;background:var(--field);color:#6F737C;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--accent);color:#fff}
.ex-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.set-grid.c{grid-template-columns:32px 1fr 1fr 1fr 44px}
.stype{height:40px;width:32px;border-radius:8px;font-size:14px;color:var(--muted);text-align:center}
.stype.warmup{color:#E0B45A}.stype.drop{color:var(--accent-text)}.stype.failure{color:var(--danger)}
/* modal + toast */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:430px;background:#131418;border-radius:20px 20px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:20px}.sheet p{margin:0 0 8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,8px);background:#202227;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.gchart{position:relative;display:flex;align-items:stretch;gap:4px;height:150px;margin-top:8px}
.gcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.gtrack{flex:1;width:100%;display:flex;align-items:flex-end}
.gbar{width:100%;min-height:2px;border-radius:4px 4px 0 0;background:#34406A}
.gbar.hit{background:var(--accent-text)}.gbar.now{opacity:.55}
.gval{font-size:10px;color:var(--muted);height:12px;line-height:12px}
.glab{font-size:10px;color:var(--muted);height:12px;line-height:12px;white-space:nowrap}
.gline{position:absolute;left:0;right:0;border-top:1px dashed var(--faint);pointer-events:none;z-index:1}
.gline span{position:absolute;right:0;top:-15px;font-size:10px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:4px}
.pthumb{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-align:left}
.pthumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--field)}
.donut{display:flex;align-items:center;gap:20px;padding-top:4px}
.donut svg{flex:none}
.legend{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.leg{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:14px}
.ldot{width:8px;height:8px;border-radius:50%}
.banner{position:relative;margin:0 -20px;height:calc(150px + env(safe-area-inset-top));background:#15171B;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.8)}
.banner.preview{margin:0;height:110px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.banner-bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 40px) 20px 0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.iconbtn.round{background:rgba(10,11,13,.55);border-radius:22px;color:var(--fg)}
.phead{margin-top:-62px;gap:4px;position:relative}
.avatar.big{width:76px;height:76px;font-size:30px;box-shadow:0 0 0 4px var(--bg)}
.bio{margin:6px 0 0;font-size:15px;line-height:1.45;white-space:pre-line}
.flag{flex:none;display:block}
.atfield{display:flex;align-items:center;background:var(--field);border-radius:10px}
.atfield>span{padding-left:12px;color:var(--muted);font-size:16px}
.atfield .text{background:transparent;padding-left:4px}
.empty{color:var(--muted);font-size:14px;padding:12px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".csv,text/csv" hidden data-change="import">
<input type="file" id="photoFile" accept="image/*" hidden data-change="photo">
<input type="file" id="bannerFile" accept="image/*" hidden data-change="banner">
<noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
<script>
'use strict';
/* ============================================================
   Træningsapp – web prototype (v1, no social yet)
   Everything lives in one state object that is saved to
   localStorage after every change, so a crash or reload never
   loses an active workout.
   ============================================================ */
const KEY = 'traeningsapp.v1';
const DAY = 86400000;
const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const $toast = document.getElementById('toast');

/* ---------- helpers ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nf = new Intl.NumberFormat('da-DK', { maximumFractionDigits: 1 });
const fmtNum = (n) => nf.format(n);
const fmtTime = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const fmtClock = (s) => s >= 3600 ? Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : fmtTime(s);
const fmtDur = (ms) => { const m = Math.max(1, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; };
const startOfDay = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const median = (a) => { const s = [...a].sort((x, y) => x - y); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const E1_MAX = 12; // Epley e1RM is only trustworthy up to ~10–12 reps
const e1 = (s) => s.kg > 0 ? s.kg * (1 + s.reps / 30) : s.reps; // Epley; bodyweight sets compare on reps
const isWarm = (s) => s.type === 'warmup';
const isWeightSet = (s) => s.reps != null;
// best working set: warm-ups never count, sets of ≤12 reps are preferred because e1RM is unreliable above that
function bestSet(sets) {
  const w = sets.filter((s) => isWeightSet(s) && !isWarm(s));
  const pool = w.filter((s) => s.reps <= E1_MAX);
  return (pool.length ? pool : w).reduce((b, s) => (!b || e1(s) > e1(b) ? s : b), null);
}
const lowConf = (s) => !!s && s.kg > 0 && s.reps > E1_MAX;
const fmtE1 = (s) => (lowConf(s) ? '≈ ' : '') + Math.round(e1(s)) + ' kg';
const volOf = (sets) => sets.reduce((t, s) => t + (isWeightSet(s) && !isWarm(s) ? s.kg * s.reps : 0), 0);
const fmtCardio = (s) => [s.min != null ? fmtNum(Math.round(s.min * 10) / 10) + ' min' : '', s.km ? fmtNum(s.km) + ' km' : '', s.inc ? fmtNum(s.inc) + ' % incline' : ''].filter(Boolean).join(' · ') || '—';
const speedOf = (s) => (s.km && s.min ? s.km / (s.min / 60) : null);
const fmtSet = (s) => !isWeightSet(s) ? fmtCardio(s) : (isWarm(s) ? 'Warm-up ' : '') + (s.kg > 0 ? fmtNum(s.kg) + ' kg' : 'BW') + ' × ' + s.reps;
const SET_TYPES = ['normal', 'warmup', 'drop', 'failure'];
const TYPE_TAG = { warmup: 'W', drop: 'D', failure: 'F' };
const TYPE_NAME = { normal: 'working set', warmup: 'warm-up', drop: 'drop set', failure: 'to failure' };
const WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const todayIndex = () => (new Date().getDay() + 6) % 7; // Monday = 0
function parseNum(v) {
  const t = String(v ?? '').trim().replace(',', '.');
  if (!/^\d{1,4}(\.\d{1,2})?$/.test(t)) return null;
  return Number(t);
}
function roundKg(x) { if (x <= 0) return 0; const step = x >= 20 ? 2.5 : 1; return Math.round(x / step) * step; }

/* ---------- icons (one consistent line set) ---------- */
const svg = (d, s = 22, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  home: svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'),
  list: svg('<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'),
  chart: svg('<path d="M3 20h18M6 16v-5M11 16V6M16 16v-8"/>'),
  sliders: svg('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'),
  user: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>', 20, 1.8),
  profile: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>', 20, 2),
  xs: svg('<path d="M7 7l10 10M17 7L7 17"/>', 16, 2),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18, 2.4),
  plus: svg('<path d="M12 5v14M5 12h14"/>', 22, 2),
  back: svg('<path d="M15 6l-6 6 6 6"/>', 18, 2),
  chev: svg('<path d="M6 9l6 6 6-6"/>', 16, 2)
};

/* ---------- seed data ---------- */
const EQUIPMENT = ['Machine', 'Free weight', 'Cable', 'Bodyweight', 'Cardio machine', 'Outdoor', 'Other'];

/* ---------- persistence (+ migration from the single-routine version) ---------- */
function migrate(s) {
  if (s && s.v === 1 && s.routine) {
    const r = { id: uid(), ...s.routine };
    s.routines = [r]; s.activeRoutineId = r.id; delete s.routine; s.v = 2;
  }
  if (s && s.v === 2) {
    s.settings.name = s.settings.name || '';
    if (s.settings.onboarded === undefined) s.settings.onboarded = false;
    if (!s.body) s.body = emptyBody();
    if (s.goal === undefined) s.goal = null;
    if (s.settings.onbStep === undefined) s.settings.onbStep = 0;
    if (s.settings.country === undefined) s.settings.country = '';
    if (s.settings.bio === undefined) s.settings.bio = '';
    if (s.settings.username === undefined) s.settings.username = '';
    if (!s.friends) s.friends = [];
    // keep built-in exercises in sync with the current muscle groups, add new built-ins
    const have = new Set(s.lib.map((x) => x.id));
    s.lib.forEach((x) => { const b = LIB.find((l) => l.id === x.id); if (b) { x.muscle = b.muscle; x.type = b.type; x.eq = b.eq; } else { if (!MUSCLES.includes(x.muscle)) x.muscle = 'Other'; if (!x.type) x.type = 'weight'; if (!x.eq) x.eq = 'Other'; } });
    LIB.forEach((b) => { if (!have.has(b.id)) s.lib.push({ ...b }); });
  }
  return s;
}

function navyFat(sex, cm, waist, neck, hip) {
  // U.S. Navy circumference method (Hodgdon & Beckett), all in cm
  if (!cm || !waist || !neck) return null;
  if (sex === 'male') { if (waist - neck <= 0) return null; return 495 / (1.0324 - 0.19077 * Math.log10(waist - neck) + 0.15456 * Math.log10(cm)) - 450; }
  if (sex === 'female') { if (!hip || waist + hip - neck <= 0) return null; return 495 / (1.29579 - 0.35004 * Math.log10(waist + hip - neck) + 0.22100 * Math.log10(cm)) - 450; }
  return null;
}
function bodyFat(b) {
  if (b.fatMode === 'manual') return b.fatManual != null ? { v: b.fatManual, est: false } : null;
  const v = navyFat(b.sex, b.height, b.waist, b.neck, b.hip);
  return v != null && v > 2 && v < 70 ? { v, est: true } : null;
}

function cleanSets(e) {
  // the sets of an active exercise that were ticked and are valid, in history format
  if (isCardio(e.exId)) {
    return e.sets.filter((s) => s.done).map((s) => ({ min: parseNum(s.min), km: parseNum(s.km), inc: parseNum(s.inc) })).filter((s) => s.min !== null && s.min > 0);
  }
  return e.sets.filter((s) => s.done).map((s) => { const o = { kg: parseNum(s.kg), reps: parseNum(s.reps) }; if (s.type && s.type !== 'normal') o.type = s.type; return o; })
    .filter((s) => s.kg !== null && s.reps !== null && s.reps >= 1);
}
function summarize(a) {
  let sets = 0, volume = 0, unticked = 0, cMin = 0, cKm = 0, upKg = 0, upLifts = 0;
  const prs = [];
  a.ex.forEach((e) => {
    const good = cleanSets(e);
    sets += good.length;
    e.sets.forEach((s) => { if (!s.done && ['kg', 'reps', 'min', 'km'].some((k) => s[k] != null && s[k] !== '')) unticked++; });
    if (!good.length) return;
    if (isCardio(e.exId)) { good.forEach((s) => { cMin += s.min; cKm += s.km || 0; }); return; }
    volume += volOf(good);
    const cur = bestSet(good); if (!cur) return;
    const all = []; state.history.forEach((w) => w.ex.forEach((x) => { if (x.exId === e.exId) all.push(...x.sets); }));
    const prior = bestSet(all);
    if (prior && e1(cur) > e1(prior) + 0.01) {
      const diff = cur.kg > 0 ? 'e1RM +' + fmtNum(Math.round((e1(cur) - e1(prior)) * 10) / 10) + ' kg' + (lowConf(cur) ? ' (rough)' : '') : '+' + (cur.reps - prior.reps) + ' reps';
      prs.push({ name: exName(e.exId), set: cur, diff });
    }
    // heavier than last time? compare top working weight with the previous session of this exercise
    const last = lastSets(e.exId);
    const top = (xs) => Math.max(0, ...xs.filter((x) => isWeightSet(x) && !isWarm(x)).map((x) => x.kg));
    if (last && top(good) > top(last)) { upKg += top(good) - top(last); upLifts++; }
  });

function chartSvg(values, label) {
  if (values.length < 2) return '';
  const w = 350, h = 96, pad = 6;
  const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
  const pts = values.map((v, i) => (i / (values.length - 1) * w).toFixed(1) + ',' + (h - pad - (v - min) / span * (h - 2 * pad)).toFixed(1)).join(' ');
  return `<svg width="100%" height="96" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}"><line x1="0" y1="${h - 1}" x2="${w}" y2="${h - 1}" stroke="#1C1E22"/><polyline fill="none" stroke="#6F8FD8" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}
const cardioTotal = (sets) => ({ min: sets.reduce((t, s) => t + (s.min || 0), 0), km: sets.reduce((t, s) => t + (s.km || 0), 0) || null });
function trainingChartHtml() {

  for (let k = 11; k >= 0; k--) {

    const v = m === 'volume' ? ws.reduce((t, w) => t + w.ex.reduce((u, x) => u + volOf(x.sets), 0), 0)
      : m === 'reps' ? ws.reduce((t, w) => t + w.ex.reduce((u, x) => u + x.sets.reduce((q, st) => q + (isWeightSet(st) && !isWarm(st) ? st.reps : 0), 0), 0), 0)
      : ws.reduce((t, w) => t + (w.end - w.start), 0) / 3600000;
    W.push({ v, label: k === 0 ? 'Now' : new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'numeric' }).replace('/', '.') });
  }
  const total = W.reduce((t, x) => t + x.v, 0); const max = Math.max(...W.map((x) => x.v)) || 1;
  const short = (v) => (m === 'time' ? fmtNum(Math.round(v * 10) / 10) + 'h' : v >= 1000 ? fmtNum(Math.round(v / 100) / 10) + 'k' : String(Math.round(v)));
  const big = m === 'volume' ? fmtNum(Math.round(total)) + ' kg' : m === 'reps' ? fmtNum(Math.round(total)) + ' reps' : fmtNum(Math.round(total * 10) / 10) + ' h';
  const unit = { volume: 'Volume (kg lifted, warm-ups excluded)', reps: 'Reps', time: 'Training time' }[m];
  return `<section><div class="label">Training · last 12 weeks</div>
    <div class="seg">${[['volume', 'Volume'], ['reps', 'Reps'], ['time', 'Time']].map(([v, l]) => `<button data-act="metric" data-m="${v}" aria-pressed="${m === v}">${l}</button>`).join('')}</div>

function strength(days) {
  const now = Date.now(), since = now - days * DAY;
  const per = {};
  state.history.forEach((w) => { if (w.start < since) return; w.ex.forEach((e) => { const b = bestSet(e.sets); if (b && b.kg > 0) (per[e.exId] = per[e.exId] || []).push({ t: w.start, e: e1(b) }); }); });
  const ids = Object.keys(per).filter((id) => per[id].length >= 2);
  const changes = ids.map((id) => per[id][per[id].length - 1].e / per[id][0].e - 1);
  const series = [];
  for (let k = 0; k <= 16; k++) {
    const t = since + (now - since) * k / 16; const r = [];
    ids.forEach((id) => { let last = null; for (const p of per[id]) { if (p.t <= t) last = p; else break; } if (last) r.push(last.e / per[id][0].e - 1); });
    series.push(r.length ? median(r) : 0);
  }
  return { pct: changes.length ? median(changes) : null, count: changes.length, series };
}

  }).join('');

      <div class="seg">${[[30, 'Month'], [90, '3 mo'], [365, 'Year']].map(([v, l]) => `<button data-act="period" data-p="${v}" aria-pressed="${p === v}">${l}</button>`).join('')}</div></header>

const SPLIT_COLORS = ['#9DB8F2', '#3A5BB0', '#E0E3EA', '#6F8FD8', '#24376E', '#8E929B', '#4A4E57'];
function muscleSplit(workouts) {
  const by = {}; let total = 0;
  workouts.forEach((w) => w.ex.forEach((e) => { const n = e.sets.filter((x) => !isWarm(x)).length; if (!n) return; const m = (exById(e.exId) || {}).muscle || 'Other'; by[m] = (by[m] || 0) + n; total += n; }));
  let parts = Object.entries(by).sort((a, b) => b[1] - a[1]).map(([label, n]) => ({ label, n }));
  if (parts.length > 7) { const rest = parts.slice(6).reduce((t, x) => t + x.n, 0); parts = parts.slice(0, 6).concat([{ label: 'Other', n: rest }]); }
  return { parts, total };
}
function donutHtml(split, label) {
  const { parts, total } = split; if (!total) return '<div class="empty">No sets logged yet.</div>';
  const r = 52, C = 2 * Math.PI * r; let off = 0;
  const arcs = parts.map((p, i) => { const len = p.n / total * C; const gap = parts.length > 1 ? Math.min(2, len / 3) : 0;
    const el = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${SPLIT_COLORS[i % SPLIT_COLORS.length]}" stroke-width="18" stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${(C - Math.max(0, len - gap)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`; off += len; return el; }).join('');
  const legend = parts.map((p, i) => `<div class="leg"><span class="ldot" style="background:${SPLIT_COLORS[i % SPLIT_COLORS.length]}"></span><span>${esc(p.label)}</span><span class="muted tnum">${Math.round(p.n / total * 100)}%</span></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(label)}: ${parts.map((p) => p.label + ' ' + Math.round(p.n / total * 100) + '%').join(', ')}">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#1C1E22" stroke-width="18"/>${arcs}
    <text x="70" y="70" text-anchor="middle" font-size="${String(total).length > 4 ? 22 : 28}" font-weight="700" fill="#F2F3F5">${fmtNum(total)}</text>
    <text x="70" y="90" text-anchor="middle" font-size="12" fill="#8E929B">sets</text></svg><div class="legend">${legend}</div></div>`;
}

/* Streak: periods in a row where you hit your goal (or trained at least once without a goal).
   The current week/month only counts once it is hit, but it never breaks the streak before it is over. */
function streakInfo() {
  const g = state.goal; const per = g ? g.per : 'week'; const need = g ? g.count : 1;
  const now = new Date();
  const startOf = (k) => (per === 'week' ? startOfDay(Date.now() - todayIndex() * DAY) - k * 7 * DAY : new Date(now.getFullYear(), now.getMonth() - k, 1).getTime());
  const count = (k) => { const s = startOf(k), e = k === 0 ? Infinity : startOf(k - 1); return state.history.filter((w) => w.start >= s && w.start < e).length; };
  let n = count(0) >= need ? 1 : 0; let k = 1;
  while (k < 520 && count(k) >= need) { n++; k++; }
  return { n, per, need };
}
const fmtStreak = (st) => st.n + ' ' + st.per + (st.n === 1 ? '' : 's');

/* Goals: how often you hit the target you set */
function goalPeriods() {
  const g = state.goal; const per = g ? g.per : 'week'; const out = [];
  if (per === 'week') {
    const mon = startOfDay(Date.now() - todayIndex() * DAY);
    for (let k = 11; k >= 0; k--) { const s = mon - k * 7 * DAY; out.push({ s, e: s + 7 * DAY, label: k === 0 ? 'Now' : new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'numeric' }).replace('/', '.') }); }
  } else {
    const now = new Date();
    for (let k = 5; k >= 0; k--) { const s = new Date(now.getFullYear(), now.getMonth() - k, 1).getTime(); out.push({ s, e: new Date(now.getFullYear(), now.getMonth() - k + 1, 1).getTime(), label: k === 0 ? 'Now' : new Date(s).toLocaleDateString('en-GB', { month: 'short' }) }); }
  }
  out.forEach((b) => { b.n = state.history.filter((w) => w.start >= b.s && w.start < b.e).length; });
  return out;
}
function goalStats() {
  const g = state.goal; const P = goalPeriods(); const from = P[0].s;
  const inRange = state.history.filter((w) => w.start >= from);
  const days = new Set(inRange.map((w) => startOfDay(w.start))).size;
  const weeks = Math.max(1, (Date.now() - from) / (7 * DAY));
  const done = P.slice(0, -1); // the current period is not over yet
  const hit = g ? done.filter((b) => b.n >= g.count).length : 0;

}

/* ============================================================
   THE BRAIN: actions (what happens when X happens)
   ============================================================ */
function beginWorkout(w) {
  if (state.active) { toast('Finish or discard your current workout first'); ui.stack = []; ui.screen = 'workout'; render(); return; }
  state.active = { id: uid(), restEnd: null, restDur: 0, changed: false, start: Date.now(), ...w };
  save(true); ui.stack = []; ui.screen = 'workout'; render(); window.scrollTo(0, 0);
}
const emptySet = (exId, type) => (isCardio(exId) ? { min: '', km: '', inc: '', done: false } : { kg: '', reps: '', done: false, type: type || 'normal' });
function startWorkout(dayId) {
  const d = dayById(dayId);
  if (!d || d.rest || !d.ex.length) { toast('This day has no exercises'); return; }
  // Copy (snapshot) the plan so later routine edits never change this workout.
  // Warm-up sets carry over from last time by position.
  beginWorkout({ dayId: d.id, name: d.name,
    ex: d.ex.map((e) => { const prev = lastSets(e.exId) || []; return { exId: e.exId, min: e.min, max: e.max, ss: e.ss || null,
      sets: Array.from({ length: Math.max(1, e.sets) }, (_, i) => emptySet(e.exId, prev[i] && prev[i].type)) }; }) });
}
function repeatWorkout(histId) {
  const w = state.history.find((x) => x.id === histId); if (!w) return;
  const d = dayById(w.dayId);
  beginWorkout({ dayId: d ? d.id : null, name: w.name,
    ex: w.ex.map((e) => { const p = d && d.ex.find((x) => x.exId === e.exId); return { exId: e.exId, min: p ? p.min : 8, max: p ? p.max : 12, ss: p ? p.ss || null : null, sets: e.sets.map((x) => emptySet(e.exId, x.type)) }; }) });
}
function markErr(ei, si, fields) {
  document.querySelectorAll(`[data-e="${ei}"][data-s="${si}"].num`).forEach((el) => { if (fields.includes(el.dataset.input)) el.classList.add('err'); });
}
function toggleSet(ei, si) {
  const a = state.active; const e = a && a.ex[ei]; const s = e && e.sets[si];
  if (!s) return;
  if (s.done) { s.done = false; save(true); render(); return; }
  const prev = lastSets(e.exId); const p = prev ? prev[Math.min(si, prev.length - 1)] : null;
  const pick = (k) => (s[k] !== '' && s[k] != null ? s[k] : (p && p[k] != null ? p[k] : ''));
  if (isCardio(e.exId)) {
    const min = parseNum(pick('min')), kmRaw = pick('km'), incRaw = pick('inc');
    const km = kmRaw === '' ? null : parseNum(kmRaw), inc = incRaw === '' ? null : parseNum(incRaw);
    const bad = [];
    if (min === null || min <= 0 || min > 600) bad.push('min');
    if (kmRaw !== '' && (km === null || km > 200)) bad.push('km');
    if (incRaw !== '' && (inc === null || inc > 40)) bad.push('inc');
    if (bad.length) { markErr(ei, si, bad); toast(bad.includes('min') ? 'Enter the time in minutes (up to 600)' : bad.includes('km') ? 'Distance must be 0–200 km' : 'Incline must be 0–40 %'); return; }
    s.min = String(min); s.km = km === null ? '' : String(km); s.inc = inc === null ? '' : String(inc); s.done = true;
    save(true); render(); advanceIfDone(ei); return; // no rest timer after cardio
  }
  const kg = parseNum(pick('kg')); const reps = parseNum(pick('reps'));
  const kgOk = kg !== null && kg <= 1000;
  const repsOk = reps !== null && Number.isInteger(reps) && reps >= 1 && reps <= 200;
  if (!kgOk || !repsOk) {
    markErr(ei, si, [!kgOk && 'kg', !repsOk && 'reps'].filter(Boolean));
    toast(!kgOk && !repsOk ? 'Enter weight and reps' : !kgOk ? 'Enter a weight from 0 to 1000 kg' : 'Reps must be a whole number from 1 to 200');
    return;
  }
  // 1) save the set first, 2) start rest as an END TIME (survives sleep/reload)
  s.kg = String(kg); s.reps = String(reps); s.done = true;
  const nextInSuperset = e.ss && a.ex[ei + 1] && a.ex[ei + 1].ss === e.ss; // in a superset you rest after the last exercise
  if (state.settings.rest.on && !nextInSuperset) { const r = restFor(e.exId); a.restEnd = Date.now() + r * 1000; a.restDur = r; }
  else if (nextInSuperset) a.restEnd = null;
  initAudio(); save(true); render(); advanceIfDone(ei);
}
// when every set of an exercise is ticked, its card fades and the next unfinished exercise scrolls into view
function advanceIfDone(ei) {
  const a = state.active; if (!a || !a.ex[ei].sets.every((x) => x.done)) return;
  const order = [...a.ex.keys()].slice(ei + 1).concat([...a.ex.keys()].slice(0, ei));
  const next = order.find((i) => !a.ex[i].sets.every((x) => x.done));
  requestAnimationFrame(() => {
    const el = document.getElementById(next === undefined ? 'finishArea' : 'ex-' + next);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: next === undefined ? 'center' : 'start' });
  });
  if (next === undefined) toast('All exercises done. Finish when you are ready.');
}
function updateRestBar() {
  const bar = document.getElementById('restbar'); if (!bar) return;
  const a = state.active;
  if (!a || !a.restEnd) { bar.hidden = true; return; }
  const rem = Math.max(0, Math.ceil((a.restEnd - Date.now()) / 1000));
  bar.hidden = false;
  document.getElementById('restlabel').textContent = fmtTime(rem);

}
function saveWorkout() {
  const a = state.active; if (!a) return;
  const ex = a.ex.map((e) => ({ exId: e.exId, sets: cleanSets(e) })).filter((e) => e.sets.length);
  if (!ex.length) { toast('Tick at least one set first'); return; }

    if (a.changed && ui.finish.updateRoutine) f.d.ex = a.ex.filter((e) => e.sets.length).map((e) => ({ exId: e.exId, sets: e.sets.length, min: e.min || 8, max: e.max || 12, ...(e.ss ? { ss: e.ss } : {}) }));
    if (f.r.mode === 'cycle') f.r.next = (f.i + 1) % f.r.days.length; // move that split's pointer
  }
  state.active = null;
  save(true);
  ui.finish = null;
  ui.summary = { id: a.id, name: a.name, dur: end - a.start, ...sum, volPct: prevVol > 0 && sum.volume > 0 ? (sum.volume / prevVol - 1) : null, streak: streakInfo(), goalNow: state.goal ? goalPeriods().slice(-1)[0].n : null, pick: Math.floor(Math.random() * 4) };
  ui.stack = []; ui.screen = 'summary'; render(); window.scrollTo(0, 0);
}
function discardWorkout() {
  state.active = null; // split pointer does NOT move
  save(true); ui.stack = []; ui.screen = 'today'; render(); window.scrollTo(0, 0);
  toast('Workout discarded');
}
function addExercise(exId) {

/* CSV ---------------------------------------------------- */
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // block spreadsheet formula injection
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function parseCsv(text) {
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim() !== ''));
}
function exportCsv() {
  const rows = [['Date', 'Workout Name', 'Exercise Name', 'Set Order', 'Weight', 'Reps', 'Distance', 'Seconds', 'Incline', 'Set Type']];
  state.history.forEach((w) => w.ex.forEach((e) => e.sets.forEach((s, i) => rows.push(isWeightSet(s)
    ? [new Date(w.start).toISOString(), w.name, exName(e.exId), i + 1, s.kg, s.reps, '', '', '', s.type || 'normal']
    : [new Date(w.start).toISOString(), w.name, exName(e.exId), i + 1, '', '', s.km ?? '', Math.round((s.min || 0) * 60), s.inc ?? '', 'cardio']))));
  if (rows.length === 1) { toast('Nothing to export yet'); return; }
  const blob = new Blob([rows.map((r) => r.map(csvCell).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob); const link = document.createElement('a');
  link.href = url; link.download = 'traeningsapp-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Exported ' + (rows.length - 1) + ' sets');
}
async function importCsv(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('File is too large (max 5 MB)'); return; }
  const rows = parseCsv(await file.text());
  if (rows.length < 2) { toast('No rows found in that file'); return; }
  const head = rows[0].map((h) => h.trim().toLowerCase().replace(/^﻿/, ''));
  const col = (...k) => head.findIndex((h) => k.includes(h));
  const cDate = col('date', 'start_time'), cName = col('workout name', 'title'), cEx = col('exercise name', 'exercise_title');
  const cKg = col('weight', 'weight_kg', 'weight (kg)'), cReps = col('reps');
  const cDist = col('distance', 'distance_km'), cSec = col('seconds', 'duration_seconds'), cInc = col('incline'), cType = col('set type', 'set_type');
  if (cDate < 0 || cEx < 0 || (cReps < 0 && cSec < 0)) { toast('Unrecognised file. Use a Hevy or Strong CSV export.'); return; }
  const TYPE_MAP = { warmup: 'warmup', dropset: 'drop', drop: 'drop', failure: 'failure' };
  const byKey = new Map(); const known = new Set(state.history.map((w) => w.start + '|' + w.name));
  let sets = 0;
  rows.slice(1).forEach((r) => {
    const raw = (r[cDate] || '').trim();
    let t = Date.parse(raw); if (isNaN(t)) t = Date.parse(raw.replace(',', ''));
    const exN = (r[cEx] || '').trim().slice(0, 40);
    if (isNaN(t) || !exN) return;
    const reps = cReps >= 0 ? parseNum(r[cReps]) : null; const kg = cKg >= 0 ? (parseNum(r[cKg]) ?? 0) : 0;
    const sec = cSec >= 0 ? parseNum(r[cSec]) : null; const km = cDist >= 0 ? parseNum(r[cDist]) : null; const inc = cInc >= 0 ? parseNum(r[cInc]) : null;
    let set;
    if (reps && reps >= 1 && reps <= 200 && kg <= 1000) { set = { kg, reps }; const ty = TYPE_MAP[(cType >= 0 ? r[cType] : '').trim().toLowerCase()]; if (ty) set.type = ty; }
    else if ((sec && sec > 0 && sec <= 36000) || (km && km > 0 && km <= 200)) set = { min: sec ? Math.round(sec / 6) / 10 : 0, km: km || null, inc: inc || null };
    else return;
    const name = ((cName >= 0 ? r[cName] : '') || 'Imported workout').trim().slice(0, 40);
    const key = t + '|' + name; if (known.has(key)) return;
    let w = byKey.get(key); if (!w) { w = { id: uid(), dayId: null, name, start: t, end: t + 3600000, ex: [] }; byKey.set(key, w); }
    let x = state.lib.find((l) => !l.hidden && l.name.toLowerCase() === exN.toLowerCase());
    if (!x) { const cardio = !isWeightSet(set); x = { id: 'c_' + uid(), name: exN, muscle: cardio ? 'Cardio' : 'Other', type: cardio ? 'cardio' : 'weight', custom: true }; state.lib.push(x); }
    if ((x.type === 'cardio') !== !isWeightSet(set)) return; // skip rows that don't match how the exercise is logged
    let e = w.ex.find((y) => y.exId === x.id); if (!e) { e = { exId: x.id, sets: [] }; w.ex.push(e); }
    e.sets.push(set); sets++;
  });
  if (!byKey.size) { toast('No new workouts found'); return; }
  state.history.push(...byKey.values()); state.history.sort((a, b) => a.start - b.start);
  save(true); render(); toast('Imported ' + byKey.size + ' workouts (' + sets + ' sets)');
}

/* ---------- progress photos: downscaled, kept in IndexedDB on this device only ---------- */
let photos = [];
let banner = null; // { id: 'banner', data } kept in the same on-device store
const PDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      const r = indexedDB.open('traeningsapp-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error);

function downscale(file, max = 1080) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Not an image')); };
    img.src = url;
  });
}

    confirmSheet({ title: 'Delete all data?', text: 'Your name, body stats, splits, every workout and all settings are removed from this device. This cannot be undone.', ok: 'Delete everything', danger: true, onOk() {
      try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      PDB.clear().catch(() => {}); photos = []; banner = null; ui.countryDraft = guessCountry(); ui.userDraft = ''; ui.userTouched = false; ui.nameDraft = '';
      state = baseState(); save(true); ui.stack = []; ui.screen = 'today'; ui.nameDraft = ''; render(); toast('All data deleted');
    } });
  },
  askDemo() {
    confirmSheet({ title: 'Load demo data?', text: 'This replaces your splits and workouts with two sample splits and a year of workouts. Your name, body stats and goal are kept.', ok: 'Load demo data', onOk() {
      const keep = { name: state.settings.name, onboarded: state.settings.onboarded }; const body = state.body; const goal = state.goal;
      state = demoState(); Object.assign(state.settings, keep); state.body = body; state.goal = goal; save(true); ui.stack = []; ui.screen = 'today'; render(); toast('Demo data loaded');
    } });
  }
};
const INPUT = {
  kg(el) { const s = state.active && state.active.ex[el.dataset.e].sets[el.dataset.s]; if (!s) return; s.kg = el.value; el.classList.remove('err'); save(); },
  min(el) { const s = state.active && state.active.ex[el.dataset.e].sets[el.dataset.s]; if (!s) return; s.min = el.value; el.classList.remove('err'); save(); },
  km(el) { const s = state.active && state.active.ex[el.dataset.e].sets[el.dataset.s]; if (!s) return; s.km = el.value; el.classList.remove('err'); save(); },
  inc(el) { const s = state.active && state.active.ex[el.dataset.e].sets[el.dataset.s]; if (!s) return; s.inc = el.value; el.classList.remove('err'); save(); },
  reps(el) { const s = state.active && state.active.ex[el.dataset.e].sets[el.dataset.s]; if (!s) return; s.reps = el.value; el.classList.remove('err'); save(); },
  dayName(el) { const d = dayById(ui.dayId); if (d) { d.name = el.value.slice(0, 40); save(); } },
  routineName(el) { const r = routineById(ui.routineId); if (r) { r.name = el.value.slice(0, 40); save(); } },
  nameDraft(el) {
    ui.nameDraft = el.value;
    const u = document.getElementById('username'); // suggest a username from the first name until the user types their own
    if (u && !ui.userTouched) { ui.userDraft = suggestUser(el.value); u.value = ui.userDraft; }
  },
  userDraft(el) { ui.userTouched = true; ui.userDraft = cleanUser(el.value); el.classList.remove('err'); const h = document.getElementById('userHint'); if (h) { const e = ui.userDraft ? userError(ui.userDraft) : ''; h.textContent = e || 'Friends will find and add you by this name. Letters, numbers, dots and underscores.'; h.className = 'small ' + (e ? 'danger' : 'muted'); } },
  profUser(el) { ui.profUser = cleanUser(el.value); el.classList.remove('err'); },
  bioDraft(el) { ui.bioDraft = el.value.slice(0, 150); const c = document.getElementById('bioCount'); if (c) c.textContent = ui.bioDraft.length + '/150'; },
  exName(el) { if (ui.exDraft) ui.exDraft.name = el.value; },
  bodyField(el) { if (!ui.body) return; ui.body[el.dataset.f] = el.value; el.classList.remove('err'); const r = document.getElementById('bodyResults'); if (r) r.innerHTML = bodyResultsHtml(); },
  search(el) { ui.q = el.value; document.getElementById('picklist').innerHTML = pickListHtml(); }
};
const CHANGE = {
  dayNameDone(el) { const d = dayById(ui.dayId); if (d && !d.name.trim()) { d.name = 'Untitled day'; el.value = d.name; } save(true); },
  routineNameDone(el) { const r = routineById(ui.routineId); if (r && !r.name.trim()) { r.name = 'Untitled split'; el.value = r.name; } save(true); },
  weekday(el) { const r = routineById(ui.routineId); if (!r) return; r.week[Number(el.dataset.w)] = el.value || null; save(true); toast(el.value ? 'Saved' : 'Set to rest'); },
  banner(el) { setBanner(el.files && el.files[0]).catch((e) => { console.error(e); toast('Could not use that image'); }); },
  countryDraft(el) { ui.countryDraft = el.value; const f = document.getElementById('countryFlag'); if (f) f.innerHTML = flagSvg(el.value, 30); },
  profCountry(el) { ui.profCountry = el.value; const f = document.getElementById('countryFlag'); if (f) f.innerHTML = flagSvg(el.value, 30); },
  photo(el) { addPhoto(el.files && el.files[0]).catch((e) => { console.error(e); toast('Could not add that photo'); }); },
  import(el) { importCsv(el.files && el.files[0]).catch((e) => { console.error(e); toast('Could not read that file'); }); }
};

document.addEventListener('click', (ev) => {
  if (ui.splitMenu && !ev.target.closest('.splitwrap')) { ui.splitMenu = false; if (!ev.target.closest('[data-act]')) { render(); return; } }
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { ev.preventDefault(); ev.stopPropagation(); fn(el.dataset, el); }
});
document.addEventListener('input', (ev) => { const k = ev.target.dataset && ev.target.dataset.input; if (k && INPUT[k]) INPUT[k](ev.target); });
document.addEventListener('change', (ev) => { const k = ev.target.dataset && ev.target.dataset.change; if (k && CHANGE[k]) CHANGE[k](ev.target); });
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && ui.modal) closeModal();
  else if (ev.key === 'Escape' && ui.splitMenu) { ui.splitMenu = false; render(); const b = document.querySelector('.splitbtn'); if (b) b.focus(); }
  if (ev.key === 'Enter' && ev.target.id === 'firstname') { ev.preventDefault(); A.saveName(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) save(true); });
window.addEventListener('pagehide', () => save(true));

/* clock: updates only the numbers, never re-renders, so typing is never interrupted */
setInterval(() => {
  const a = state.active; if (!a) return;
  const el = document.getElementById('elapsed'); if (el) el.textContent = fmtClock(Math.floor((Date.now() - a.start) / 1000));
  if (a.restEnd && Date.now() >= a.restEnd) {
    const late = Date.now() - a.restEnd; a.restEnd = null; save(true);
    if (late < 5000) restDoneAlert();
  }
  updateRestBar();
}, 250);

render();
loadPhotos();
</script>
</body>
</html>
